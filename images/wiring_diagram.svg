<text x="60" y="670" font-size="13" fill="#555">Both modules share the I2C bus: MAX30102 at 0x57, OLED at 0x3C. Feather M0 is 3.3 V — do not use 5 V. A4/A5 are not I2C pins on the Feather.</text>
